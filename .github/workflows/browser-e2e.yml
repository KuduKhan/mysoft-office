name: Browser smoke tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    # Playwright 1.56.1 Chromium is unsupported on ubuntu26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify repository integrity
        run: npm run check:repo
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Install independent Office validators
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2
      - name: Generate compressed Office fixtures
        run: python scripts/make_office_fixtures.py
      - name: Run browser tests
        run: npx playwright test
      - name: Check exported Office packages with independent readers
        run: python scripts/check_ooxml.py
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02d
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5
